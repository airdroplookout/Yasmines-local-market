# Security headers on every page.
# Content-Security-Policy (audit M-3, enforced Nov 25, 2026): inline
# <script> blocks and onclick=/onerror= handlers were moved into external
# JS first (app.js, mary.js, contact.js), and the Manage <style> block was
# moved into styles.css, so script-src 'self' is safe. style-src keeps
# 'unsafe-inline' because the pages still use a few style="..." attributes.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
